name: hackertube
version: 0.2.2
description: Source-backed media search and discovery in the Hermes web dashboard.
requires_hermes: ">=0.23.0"
config_schema:
  provider:
    type: string
    choices: [hermes, stub]
    default: hermes
    description: >-
      Hermes uses the existing provider/model selected for HackerTube search
      under Models → Auxiliary. Stub is for offline development only.
  youtube_key:
    type: secret
    env: YOUTUBE_API_KEY
    required: false
    description: Existing YouTube Data API key, used only after enabling the source.
  podcastindex_key:
    type: secret
    env: PODCASTINDEX_API_KEY
    required: false
    description: Podcast Index API key for targeted user searches.
  podcastindex_secret:
    type: secret
    env: PODCASTINDEX_API_SECRET
    required: false
    description: Podcast Index API secret; never written to plugin data.
  openlibrary_contact:
    type: secret
    env: OPENLIBRARY_CONTACT
    required: false
    description: Contact email or phone sent only in Open Library request headers; never in plugin data or source files.
